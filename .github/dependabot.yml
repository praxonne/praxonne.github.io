version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro-toolchain:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "typescript"
    ignore:
      # Astro 7's checker does not yet support TypeScript 7. Keep receiving
      # security and patch updates on the supported TypeScript 6 line.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
