name: deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install checksum-verified Zed
        shell: bash
        run: bash scripts/install-zed.sh

      - name: Restore locked Zed dependencies and Node.js
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/.zed/bin:$PATH"
          zed validate --require-lock
          zed install --frozen
          zed install --frozen --cli nodejs@24.19.0
          echo "$PWD/.zed/tools/bin" >> "$GITHUB_PATH"

      - name: Build immutable Astro artifact
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm install --frozen-lockfile
          corepack pnpm run check

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
