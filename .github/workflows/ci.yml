name: site conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-verified Zed
        shell: bash
        run: bash scripts/install-zed.sh

      - name: Restore locked Zed dependencies and Node.js
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/.zed/bin:$PATH"
          zed validate --require-lock
          zed install --frozen
          zed install --frozen --cli nodejs@24.19.0
          echo "$PWD/.zed/tools/bin" >> "$GITHUB_PATH"

      - name: Install locked Astro dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck, build, and verify site contract
        shell: bash
        run: corepack pnpm run check
